# Runs only after this app is placed at the root of its own repository.
name: Test, collect and publish
on:
  workflow_dispatch:
    inputs:
      initialize_analysis_cache:
        description: 'Initialize missing discussion analysis budget ledger (approval required; first run only)'
        type: boolean
        default: false
      initialize_translation_cache:
        description: 'Initialize missing AI budget ledger (approval required; first run only)'
        type: boolean
        default: false
  schedule:
    - cron: '17 10 * * *' # 19:17 JST; actual start can be delayed.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test collector and release packaging
        run: python -m unittest discover -s tests -v
      - name: Collect fresh public feeds
        run: python collector/collect.py --overwrite
      - name: Restore translation and budget cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: .cache/translations.sqlite3
          key: translation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: translation-v1-
      - name: Enrich articles with optional Japanese translations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLE_AI_TRANSLATION: ${{ vars.ENABLE_AI_TRANSLATION }}
          INITIALIZE_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_translation_cache }}
        shell: bash
        run: |
          flags=()
          if [ "$ENABLE_AI_TRANSLATION" = "true" ]; then flags+=(--allow-api); fi
          if [ "$INITIALIZE_CACHE" = "true" ]; then flags+=(--initialize-cache); fi
          python collector/translate.py --output frontend/public/data/articles.json --overwrite "${flags[@]}"
      - name: Persist translations and reserved budget even after partial failure
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .cache/translations.sqlite3
          key: translation-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect optional Hacker News discussion metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_HN_DISCUSSIONS == 'true'
        continue-on-error: true
        run: python collector/discussions.py --output frontend/public/data/articles.json --overwrite --allow-api
      - name: Restore discussion analysis cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_DISCUSSION_ANALYSIS == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/discussion-analysis.sqlite3
          key: discussion-analysis-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discussion-analysis-v1-
      - name: Analyze verified Hacker News comments
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_HN_DISCUSSIONS == 'true' && vars.ENABLE_DISCUSSION_ANALYSIS == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INITIALIZE_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_analysis_cache }}
        shell: bash
        run: |
          flags=()
          if [ "$INITIALIZE_CACHE" = "true" ]; then flags+=(--initialize-cache); fi
          python collector/analyze_discussions.py --output frontend/public/data/articles.json --overwrite --allow-hn --allow-ai "${flags[@]}"
      - name: Persist analysis cache and budget
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_DISCUSSION_ANALYSIS == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/discussion-analysis.sqlite3
          key: discussion-analysis-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove excerpts from final deployment data
        run: python tools/public_feed.py frontend/public/data/articles.json
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build static site
        working-directory: frontend
        run: pnpm build
      - name: Test article rendering
        working-directory: frontend
        run: pnpm test
      - name: Upload only the built site
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
