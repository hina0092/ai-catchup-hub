# Runs only after this app is placed at the root of its own repository.
name: Test, collect and publish
on:
  workflow_dispatch:
    inputs:
      test_one_article:
        description: 'Approved one-time free-tier API test: at most one article; does not enable scheduled generation'
        type: boolean
        default: false
      initialize_gemini_cache:
        description: 'Create ai-cache branch only on first approved setup (never reset existing cache)'
        type: boolean
        default: false
  schedule:
    - cron: '17 10 * * *' # 19:17 JST; actual start can be delayed.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write # ai-cache only; application checkout never retains credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test collector and release packaging
        run: python -m unittest discover -s tests -v
      - name: Collect fresh public feeds
        run: python collector/collect.py --overwrite
      - name: Load durable Gemini cache
        id: gemini_cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INITIALIZE_GEMINI_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_gemini_cache }}
        run: python tools/ai_cache.py "${{ runner.temp }}/hub-ai-cache"
      - name: Apply cached summaries and optionally generate with free Gemini
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.gemini_cache.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_GEMINI: ${{ vars.ENABLE_GEMINI }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_BILLING_DISABLED: ${{ vars.GEMINI_BILLING_DISABLED }}
          GEMINI_FREE_TIER_REVIEWED_ON: ${{ vars.GEMINI_FREE_TIER_REVIEWED_ON }}
          GEMINI_ONE_ARTICLE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_one_article }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          config = json.loads(Path('collector/gemini_config.json').read_text())
          if os.environ.get('GEMINI_ONE_ARTICLE_TEST') == 'true':
              config.update(enabled=True, max_articles=1)
              os.environ['ENABLE_GEMINI'] = 'true'
          path = Path(os.environ['RUNNER_TEMP']) / 'gemini-run-config.json'
          path.write_text(json.dumps(config))
          sys.exit(subprocess.call([sys.executable, '-m', 'collector.gemini', '--config', str(path),
                                    '--cache-dir', str(path.parent / 'hub-ai-cache')]))
          PY
      - name: Collect optional Hacker News discussion metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_HN_DISCUSSIONS == 'true'
        continue-on-error: true
        run: python collector/discussions.py --output frontend/public/data/articles.json --overwrite --allow-api
      - name: Remove excerpts from final deployment data
        run: python tools/public_feed.py frontend/public/data/articles.json
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build static site
        working-directory: frontend
        run: pnpm build
      - name: Test article rendering
        working-directory: frontend
        run: pnpm test
      - name: Upload only the built site
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
