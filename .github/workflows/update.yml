# Runs only after this app is placed at the root of its own repository.
name: Update AI feed and publish
on:
  workflow_dispatch:
    inputs:
      generate:
        description: 'Generate up to three new cards within the shared daily budget'
        type: boolean
        default: false
  schedule:
    - cron: '17 10 * * *' # 19:17 JST; GitHub may delay the start.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: card-generation-trial # shared with manual trials; do not overlap reservations
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write # only the existing card-trial-state data/budget branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test collector and release packaging
        run: python -m unittest discover -s tests -v
      - name: Restore published cards and optionally collect and generate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_GEMINI: ${{ vars.ENABLE_GEMINI }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_BILLING_DISABLED: ${{ vars.GEMINI_BILLING_DISABLED }}
          GEMINI_FREE_TIER_REVIEWED_ON: ${{ vars.GEMINI_FREE_TIER_REVIEWED_ON }}
          RUN_GENERATION: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate) }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          command = [sys.executable, '-m', 'tools.daily_remote',
                     '--state-dir', str(temporary / 'daily-card-state'),
                     '--ledger-dir', str(temporary / 'daily-card-ledger')]
          if os.environ.get('RUN_GENERATION') == 'true':
              command.append('--live')
          sys.exit(subprocess.call(command))
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build static site
        working-directory: frontend
        run: pnpm build
      - name: Test article rendering
        working-directory: frontend
        run: pnpm test
      - name: Upload only the built site
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
